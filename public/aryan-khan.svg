<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  <rect width="800" height="1000" fill="url(#grid)" />

  <!-- Soft Ambient Glow -->
  <circle cx="400" cy="380" r="260" fill="#1e40af" opacity="0.18" filter="blur(70px)" />
  <circle cx="400" cy="680" r="200" fill="#f59e0b" opacity="0.08" filter="blur(60px)" />

  <!-- Outer Architectural Framing -->
  <rect x="28" y="28" width="744" height="944" rx="28" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.5" />
  <rect x="40" y="40" width="720" height="920" rx="20" fill="none" stroke="#1e3a8a" stroke-width="1" opacity="0.4" />

  <!-- Top Brand Label -->
  <g transform="translate(400, 115)">
    <rect x="-130" y="-18" width="260" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8" />
    <text x="0" y="5" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="3">OFFICIAL PROFILE</text>
  </g>

  <!-- Central Seal Emblem -->
  <g transform="translate(400, 360)">
    <!-- Outer concentric rings -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#1e3a8a" stroke-width="2.5" opacity="0.6" />
    <circle cx="0" cy="0" r="148" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="5,5" opacity="0.7" />
    <circle cx="0" cy="0" r="136" fill="url(#sealGrad)" stroke="url(#goldGrad)" stroke-width="3" />

    <!-- Monogram: AK -->
    <text x="0" y="32" text-anchor="middle" fill="url(#goldGrad)" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold" letter-spacing="2">AK</text>
  </g>

  <!-- Founder Name -->
  <text x="400" y="595" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="1.5">ARYAN KHAN</text>

  <!-- Title / Designation -->
  <text x="400" y="640" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="2">FOUNDER &amp; CAREER SPECIALIST</text>

  <!-- Subtle Divider -->
  <line x1="280" y1="680" x2="520" y2="680" stroke="#334155" stroke-width="1.5" />
  <circle cx="400" cy="680" r="3.5" fill="#38bdf8" />

  <!-- Studio Brand Title -->
  <text x="400" y="730" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="4">MR ARYAN SERVICE</text>

  <!-- Studio Services Description -->
  <text x="400" y="770" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" letter-spacing="1.5">ATS Resume Studio &amp; Executive Advisory</text>

  <!-- Clean Bottom Category Bars (Neutral - No Checkmarks, No Prices) -->
  <g transform="translate(400, 840)">
    <g transform="translate(-150, 0)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">Resume Studio</text>
    </g>
    <g transform="translate(150, 0)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">Career Advisory</text>
    </g>
  </g>
</svg>
